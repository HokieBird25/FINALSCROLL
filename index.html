<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Saved Reels Shuffle</title>
  <style>
    :root {
      --bg: #000;
      --panel: #16161d;
      --line: #2a2a36;
      --text: #f4f4f7;
      --muted: #9a9aaa;
      --accent: #ff3b7a;
      --accent-2: #7c5cff;
      --frame: #ececf2;
      --search-h: 56px;
      --crop-zoom: 1.55;
      --crop-origin-y: 26%;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f4f4f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    #start {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .start-card {
      max-width: 520px;
      padding: 32px 28px;
      background: #16161d;
      border: 1px solid #2a2a36;
      border-radius: 20px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    .lede { color: #c9c9d4; line-height: 1.5; }
    #file { display: block; margin: 16px 0; color: #fff; }
    .error { color: #ff7b7b; }
    #player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      flex-direction: column;
    }
    body.is-playing #player { display: flex; }
    body.is-playing #start { display: none; }
    .search-row {
      height: 56px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
    }
    #search {
      flex: 1;
      min-width: 0;
      background: #16161d;
      border: 1px solid #2a2a36;
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
    }
    .pos { color: #9a9aaa; font-size: 13px; white-space: nowrap; }
    button, .open-btn {
      border: 0;
      background: #2a2a38;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      white-space: nowrap;
    }
    .theater {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .phone {
      width: min(100vw, calc((100dvh - 56px) * 9 / 16));
      height: min(calc(100dvh - 56px), calc(100vw * 16 / 9));
      border: 3px solid #ececf2;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    #embed { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .open-btn {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      font-weight: 700;
    }
    #when {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 10px;
      margin: 0;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
    .edge {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 12%;
      max-width: 80px;
      background: transparent;
      z-index: 5;
    }
    #prev { left: 0; }
    #next { right: 0; }
  </style>
</head>
<body>
  <section id="start">
    <div class="start-card">
      <h1>Saved Reels Shuffle</h1>
      <p class="lede">Pick your Instagram <code>saved_posts.json</code> file here.</p>
      <input id="file" type="file" />
      <p id="status" class="lede"></p>
      <p id="error" class="error"></p>
    </div>
  </section>

  <section id="player">
    <div class="search-row">
      <input id="search" type="search" placeholder="Search username or caption…" />
      <button id="prevBtn" type="button">Prev</button>
      <span id="pos" class="pos">0 / 0</span>
      <button id="nextBtn" type="button">Next</button>
      <button id="shuffle" type="button">Shuffle</button>
    </div>
    <main class="theater">
      <button id="prev" class="edge" type="button" aria-label="Previous"></button>
      <div class="phone">
        <div id="embed"></div>
        <a id="open" class="open-btn" href="#" target="_blank" rel="noopener noreferrer">Open in Instagram</a>
        <p id="when"></p>
      </div>
      <button id="next" class="edge" type="button" aria-label="Next"></button>
    </main>
  </section>

  <script>
    const state = { all: [], view: [], index: 0, query: "" };

    function fieldMap(dict) {
      const out = {};
      if (!Array.isArray(dict)) return out;
      for (const item of dict) {
        if (item && item.label) out[item.label] = item.value || item.href || "";
      }
      return out;
    }

    function parseItem(raw) {
      const list = Array.isArray(raw.label_values) ? raw.label_values : [];
      let url = "", caption = "", username = "", name = "";
      const hashtags = [];
      for (const f of list) {
        if (f.label === "URL") url = f.value || f.href || url;
        if (f.label === "Caption" && f.value && !caption) caption = f.value;
        if (f.title === "Hashtags" && Array.isArray(f.dict)) {
          for (const wrap of f.dict) {
            const tag = fieldMap(wrap.dict).Name;
            if (tag) hashtags.push(tag);
          }
        }
        if (f.title === "Owner" && f.dict && f.dict[0]) {
          const owner = fieldMap(f.dict[0].dict);
          username = owner.Username || username;
          name = owner.Name || name;
        }
      }
      url = String(url || raw.href || raw.url || "").trim();
      const shortcode = (url.match(/instagram\.com\/(?:reel|p|tv)\/([^/?#]+)/i) || [])[1] || "";
      const kind = /\/reel\//i.test(url) ? "reel" : /\/tv\//i.test(url) ? "tv" : shortcode ? "post" : "link";
      return { url, shortcode, kind, caption: caption || "", username: username || "unknown", name: name || "", hashtags, timestamp: raw.timestamp || 0, fbid: raw.fbid || "" };
    }

    function unwrap(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== "object") return [];
      for (const v of Object.values(data)) {
        if (Array.isArray(v) && v.length && typeof v[0] === "object") return v;
      }
      return [];
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      state.view = state.all.filter((item) => {
        if (!item.url) return false;
        if (!q) return true;
        return item.username.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.caption.toLowerCase().includes(q) || item.hashtags.some((t) => t.toLowerCase().includes(q));
      });
      if (state.index >= state.view.length) state.index = 0;
    }

    function formatWhen(ts) {
      if (!ts) return "";
      const ms = ts > 1e12 ? ts : ts * 1000;
      return "Saved " + new Date(ms).toLocaleString();
    }

    function showPlayer() {
      document.body.className = "is-playing";
      const start = document.getElementById("start");
      if (start && start.parentNode) start.parentNode.removeChild(start);
    }

    function render() {
      const item = state.view[state.index];
      const pos = document.getElementById("pos");
      const when = document.getElementById("when");
      const open = document.getElementById("open");
      const embed = document.getElementById("embed");
      if (pos) pos.textContent = state.view.length ? (state.index + 1) + " / " + state.view.length : "0 / 0";
      if (!item) {
        if (embed) embed.innerHTML = "";
        if (when) when.textContent = "";
        return;
      }
      if (when) when.textContent = formatWhen(item.timestamp);
      if (open) open.href = item.url;
      const path = item.kind === "post" ? "p" : item.kind === "tv" ? "tv" : "reel";
      if (embed && item.shortcode) {
        embed.innerHTML = '<iframe src="https://www.instagram.com/' + path + '/' + encodeURIComponent(item.shortcode) + '/embed/" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      }
    }

    function go(delta) {
      if (!state.view.length) return;
      state.index = (state.index + delta + state.view.length) % state.view.length;
      render();
    }

    function loadFromData(data) {
      const items = unwrap(data).map(parseItem).filter((x) => x.url);
      if (!items.length) throw new Error("No Instagram links found in that file.");
      state.all = items;
      state.index = 0;
      applyFilters();
      state.view = shuffle(state.view);
      showPlayer();
      render();
    }

    function handleFile(file) {
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      if (status) status.textContent = "Reading " + file.name + "…";
      if (error) error.textContent = "";
      const reader = new FileReader();
      reader.onload = function () {
        try {
          loadFromData(JSON.parse(String(reader.result || "")));
        } catch (e) {
          if (error) error.textContent = e.message || "Could not read that file.";
          if (status) status.textContent = "";
        }
      };
      reader.onerror = function () {
        if (error) error.textContent = "The browser could not read that file.";
      };
      reader.readAsText(file);
    }

    document.getElementById("file").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (file) handleFile(file);
    });

    document.getElementById("next").addEventListener("click", function () { go(1); });
    document.getElementById("prev").addEventListener("click", function () { go(-1); });
    document.getElementById("nextBtn").addEventListener("click", function () { go(1); });
    document.getElementById("prevBtn").addEventListener("click", function () { go(-1); });

    let wheelLock = false;
    document.getElementById("player").addEventListener("wheel", function (e) {
      e.preventDefault();
      if (wheelLock) return;
      if (e.deltaY === 0) return;
      wheelLock = true;
      go(e.deltaY > 0 ? 1 : -1);
      setTimeout(function () { wheelLock = false; }, 350);
    }, { passive: false });
    document.getElementById("shuffle").addEventListener("click", function () {
      state.view = shuffle(state.view);
      state.index = 0;
      render();
    });
    document.getElementById("search").addEventListener("input", function (e) {
      state.query = e.target.value;
      applyFilters();
      render();
    });

    window.addEventListener("keydown", function (e) {
      if (!document.body.classList.contains("is-playing")) return;
      if (e.target && e.target.id === "search") return;
      if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    });

    let touchY = null;
    window.addEventListener("touchstart", function (e) {
      if (!document.body.classList.contains("is-playing")) return;
      touchY = e.changedTouches[0].clientY;
    });
    window.addEventListener("touchend", function (e) {
      if (touchY == null) return;
      const dy = e.changedTouches[0].clientY - touchY;
      touchY = null;
      if (Math.abs(dy) < 50) return;
      go(dy < 0 ? 1 : -1);
    });
  </script>
</body>
</html>
